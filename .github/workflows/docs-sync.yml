name: Sync Documentation from Code

on:
  push:
    branches: [main]
    paths:
      - 'src/tools/**/*.ts'
      - 'src/types/**/*.ts'

  workflow_dispatch:

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Generate tool schemas
        run: |
          echo "Tool schema generation would run here"
          echo "This validates that Zod schemas are parseable"

      - name: Validate documentation examples
        run: |
          echo "Documentation example validation would run here"
          echo "This ensures code examples in docs are valid"

      - name: Check for schema changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: auto-sync from code changes'
          title: 'docs: auto-sync tool schemas from code'
          body: |
            ## Automated Documentation Update

            This PR was automatically generated because tool schemas in `src/tools/` were modified.

            ### Changes
            - Updated tool documentation to match current Zod schemas
            - Regenerated JSON schemas for `.well-known/mcp.json`

            ### Review Checklist
            - [ ] Verify tool parameters are correctly documented
            - [ ] Check example requests/responses are valid
            - [ ] Confirm error messages are accurate
          branch: docs/auto-sync
          delete-branch: true
          labels: |
            documentation
            automated
