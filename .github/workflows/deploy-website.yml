name: Deploy Documentation Site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'llms.txt'
      - '.well-known/**'
      - 'AGENTS.md'

  workflow_dispatch:

# Only the newest docs deploy for a ref matters — cancel superseded ones in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy agent discovery files to public
        run: |
          mkdir -p website/public/.well-known
          cp llms.txt website/public/
          cp .well-known/mcp.json website/public/.well-known/

      - name: Build site
        run: pnpm docs:build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # amondnet/vercel-action@v25 pins Vercel CLI 25.1.0, which Vercel's API now
          # rejects ("requires version 47.2.2 or later"). Install a current CLI instead.
          vercel-version: latest
          # Run from the repo root: the Vercel project's Root Directory is already set to
          # `website`. Also setting working-directory: website double-applies it and Vercel
          # looks for `website/website`, which does not exist.
          vercel-args: '--prod'
