version: 2
updates:
  # pnpm workspace. Each workspace package needs its own entry: with a single
  # `directory: "/"`, Dependabot does not reliably pick up nested workspace
  # manifests, so desktop/dashboard/website updates would be missed.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/desktop"
      - "/dashboard"
      - "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Grouping stops a repo this size from saturating the PR limit with one PR
    # per dependency. Groups are bounded to minor/patch so that major bumps
    # fall outside them and arrive as individual PRs: a framework major such as
    # next 15 -> 16 or fumadocs 15 -> 16 needs migration work and its own
    # review, not a 37-package all-or-nothing sweep that cannot be landed.
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # GitHub Actions majors are left grouped: they are small, self-contained
  # version pins, and the 7-major sweep in #129 passed every CI gate.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
