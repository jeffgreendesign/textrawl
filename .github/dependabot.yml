version: 2
updates:
  # pnpm workspace. The root entry alone covers every workspace package: it
  # reads pnpm-workspace.yaml and updates nested manifests together with the
  # single root pnpm-lock.yaml. Do not add the workspace directories as extra
  # entries - they raise duplicate PRs that change only the nested
  # package.json, never the lockfile, and fail `pnpm install --frozen-lockfile`.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Grouping stops a repo this size from saturating the PR limit with one PR
    # per dependency. Groups are bounded to minor/patch so that major bumps
    # fall outside them and arrive as individual PRs: a framework major such as
    # next 15 -> 16 or fumadocs 15 -> 16 needs migration work and its own
    # review, not a 37-package all-or-nothing sweep that cannot be landed.
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # GitHub Actions majors are left grouped: they are small, self-contained
  # version pins, and the 7-major sweep in #129 passed every CI gate.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
